appId: pl.panszczesniak.pssa.dev
productName: PSSA 2 Dev
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target: nsis
  artifactName: PSSA-2-Dev-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: PSSA 2 Dev
