appId: pl.panszczesniak.pssa.dev
productName: PSSA 2 Dev
directories:
  output: dist
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
asar: true
asarUnpack:
  - out/main/**/*
npmRebuild: false
win:
  target: nsis
  artifactName: PSSA-2-Dev-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: PSSA 2 Dev
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
