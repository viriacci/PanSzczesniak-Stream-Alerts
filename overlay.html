<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Twitch Reward Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", Arial, sans-serif;
    }
    #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        pointer-events: none;
    }
    #gif {
        max-width: 480px;
        max-height: 480px;
        opacity: 0;
        transform: scale(0.9);
        transition: opacity 0.6s ease, transform 0.6s ease;
        filter: drop-shadow(0 0 14px rgba(0,0,0,0.7));
    }
    #gif.show {
        opacity: 1;
        transform: scale(1);
    }
    #caption {
        opacity: 0;
        transition: opacity 0.6s ease 0.15s; /* leciutkie opoznienie wzgledem gifa */
        background-color: #843935;
        border: 3px solid #000000;
        border-radius: 6px;
        padding: 6px 26px;
        box-shadow: 0 0 18px rgba(0,0,0,0.6);
    }
    #caption.show {
        opacity: 1;
    }
    #caption-text {
        font-family: "Amatic SC", cursive;
        font-weight: 700;
        font-size: 46px;
        line-height: 1;
        color: #ffffff;
        text-shadow: 0 0 6px rgba(0,0,0,0.8);
        white-space: nowrap;
    }
</style>
</head>
<body>
<div id="stage">
    <img id="gif" src="" alt="">
    <div id="caption"><div id="caption-text"></div></div>
</div>

<script>
const WS_PORT = 8765; // musi sie zgadzac z overlay_ws_port w config.json
const wsUrl = `ws://${location.hostname}:${WS_PORT}`;

const gifEl = document.getElementById("gif");
const captionEl = document.getElementById("caption");
const captionTextEl = document.getElementById("caption-text");
let hideTimer = null;

function connect() {
    const ws = new WebSocket(wsUrl);

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "redeem") {
            showReward(data.gif, data.sound, data.duration || 5, data.title || "", data.user || "");
        }
    };

    ws.onclose = () => {
        setTimeout(connect, 3000);
    };

    ws.onerror = () => ws.close();
}

function showReward(gifUrl, soundUrl, duration, title, user) {
    clearTimeout(hideTimer);

    if (gifUrl) {
        gifEl.src = gifUrl + "?t=" + Date.now();
        gifEl.classList.add("show");
    }
    if (title) {
        captionTextEl.textContent = `${user} odbiera ${title}`;
        captionEl.classList.add("show");
    }
    if (soundUrl) {
        const audio = new Audio(soundUrl);
        audio.play().catch((e) => console.warn("Nie udalo sie odtworzyc dzwieku:", e));
    }

    hideTimer = setTimeout(() => {
        gifEl.classList.remove("show");
        captionEl.classList.remove("show");
    }, duration * 1000);
}

connect();
</script>
</body>
</html>
