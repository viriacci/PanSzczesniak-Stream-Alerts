name: PSSA v2 Windows verification
on:
  push:
    branches: [develop/v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pssa-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - name: Dependency advisory report
        shell: pwsh
        run: |
          npm audit --json | Set-Content -Encoding utf8 npm-audit.json
          $auditExit = $LASTEXITCODE
          if ($auditExit -ne 0) { Write-Warning "npm audit returned $auditExit; report requires triage" }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pssa-npm-audit
          path: npm-audit.json
          if-no-files-found: error
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PSSA-2-Dev-Windows
          path: dist/*.exe
          if-no-files-found: error
