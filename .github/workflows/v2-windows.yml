name: PSSA v2 Windows verification
on:
  push:
    branches: [develop/v2]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pssa-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: npm ci
      - name: Dependency advisory report
        shell: pwsh
        run: |
          npm audit --json | Set-Content -Encoding utf8 npm-audit.json
          $auditExit = $LASTEXITCODE
          if ($auditExit -ne 0) { Write-Warning "npm audit returned $auditExit; report requires triage" }
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pssa-npm-audit
          path: npm-audit.json
          if-no-files-found: error
      - name: Require clean npm audit
        shell: pwsh
        run: |
          $r = Get-Content npm-audit.json -Raw | ConvertFrom-Json
          if ($null -eq $r.metadata.vulnerabilities.total -or $r.metadata.vulnerabilities.total -ne 0) { throw 'Dependency audit failed' }
      - name: Complete source and dependency inventory
        run: node scripts/audit-inventory.mjs
      - name: SBOM
        shell: pwsh
        run: npm sbom --package-lock-only --sbom-format cyclonedx | Set-Content -Encoding utf8 sbom.json
      - name: Compare synthetic CPU and SQL workload with beta.2
        shell: pwsh
        run: |
          git worktree add --detach baseline f19ab6417ca0fe17edde0ab02bb88dd1e6f5a9fe
          node --experimental-strip-types scripts/performance.mjs baseline | Set-Content -Encoding utf8 perf-before.json
          if ($LASTEXITCODE -ne 0) { throw 'Baseline benchmark failed' }
          node --experimental-strip-types scripts/performance.mjs . | Set-Content -Encoding utf8 perf-after.json
          if ($LASTEXITCODE -ne 0) { throw 'Current benchmark failed' }
          git worktree remove baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pssa-technical-audit
          path: |
            audit-inventory.json
            sbom.json
            perf-before.json
            perf-after.json
          if-no-files-found: error
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pssa-debug-source-maps
          path: out/**/*.map
          if-no-files-found: error
      - run: npm run smoke
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/win-unpacked/PSSA 2 Dev.exe'
          if (-not (Test-Path $exe)) { throw 'Packaged executable missing' }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'Packaged smoke timeout' }
          if ($p.ExitCode -ne 0) { throw "Packaged smoke exit $($p.ExitCode)" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PSSA-2-Dev-Windows
          run-id: 45382575827
          github-token: ${{ github.token }}
          path: previous-beta
      - name: Verify clean NSIS installation
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -Filter 'PSSA-2-Dev-*.exe' -File)
          if ($setup.Count -ne 1) { throw 'Expected exactly one setup executable' }
          $dir = Join-Path $env:RUNNER_TEMP 'PSSA-install-smoke'
          if (Test-Path $dir) { throw 'Install path already exists' }
          $p = Start-Process -FilePath $setup[0].FullName -ArgumentList "/S /D=$dir" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Installer timeout' }
          if ($p.ExitCode -ne 0) { throw "Installer exit $($p.ExitCode)" }
          $exe = Join-Path $dir 'PSSA 2 Dev.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'Installed smoke timeout' }
          if ($p.ExitCode -ne 0) { throw "Installed smoke exit $($p.ExitCode)" }
      - name: Verify upgrade and retained data on uninstall
        shell: pwsh
        run: |
          $old = @(Get-ChildItem previous-beta -Filter '*.exe' -File)
          $new = @(Get-ChildItem dist -Filter 'PSSA-2-Dev-*.exe' -File)
          if ($old.Count -ne 1 -or $new.Count -ne 1) { throw 'Installer missing' }
          $dir = Join-Path $env:RUNNER_TEMP 'PSSA-install-smoke'
          $uninstaller = @(Get-ChildItem $dir -Filter 'Uninstall*.exe' -File)
          if ($uninstaller.Count -ne 1) { throw 'Uninstaller missing' }
          $data = Join-Path $env:APPDATA 'PSSA 2 Dev'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $marker = Join-Path $data 'ci-retention-marker.txt'
          Set-Content -LiteralPath $marker -Value 'preserve'
          function Run-Installer($path, $arguments) {
            $p = Start-Process -FilePath $path -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Install operation timeout' }
            if ($p.ExitCode -ne 0) { throw "Install operation exit $($p.ExitCode)" }
          }
          Run-Installer $uninstaller[0].FullName '/S'
          if (-not (Test-Path $marker)) { throw 'Uninstall removed app data' }
          Run-Installer $old[0].FullName "/S /D=$dir"
          Run-Installer $new[0].FullName "/S /D=$dir"
          if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne 'preserve') { throw 'Upgrade removed app data' }
          Run-Installer (Join-Path $dir 'PSSA 2 Dev.exe') '--smoke-test'
          $uninstaller = @(Get-ChildItem $dir -Filter 'Uninstall*.exe' -File)
          if ($uninstaller.Count -ne 1) { throw 'Uninstaller missing after upgrade' }
          Run-Installer $uninstaller[0].FullName '/S'
          if (-not (Test-Path $marker)) { throw 'Uninstall removed data after upgrade' }
      - name: Hash verified installer
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -Filter 'PSSA-2-Dev-*.exe' -File)
          if ($setup.Count -ne 1) { throw 'Expected exactly one installer' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($setup[0].Name)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PSSA-2-Dev-Windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
